name: Check quiz image links

on:
  schedule:
    - cron: '0 6 * * 1' # tous les lundis à 6h UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check-images
